name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          ESCALATION_OPEN_BROWSER: "0"
        run: python -m pytest -q

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment and start the service
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          export APS_STATE_DIR=/tmp/aps-state BOB_SETTINGS_PATH=/tmp/bob/settings.json ESCALATION_OPEN_BROWSER=0
          /tmp/clean/bin/aps --version
          /tmp/clean/bin/aps install
          /tmp/clean/bin/aps start
          /tmp/clean/bin/aps doctor
          echo '{"hook_event_name":"PreToolUse","tool_use_id":"t","session_id":"s","tool_name":"execute_command","tool_input":{"command":"git status"},"cwd":"/tmp"}' \
            | /tmp/clean/bin/python "$(/tmp/clean/bin/python -c 'from ai_permission_supervisor import config; print(config.HOOK_SCRIPT)')"
          /tmp/clean/bin/aps stop
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
